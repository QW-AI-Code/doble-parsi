name: release

# Publishes a GitHub Release (Releases panel on the repo home page) for the
# version in manifest.json. Runs on every push to main/master, on v*.*.* tags,
# and by hand from the Actions tab ("Run workflow").
# Lint and tests are run by the separate "build" workflow, so a failing test
# can no longer stop the release from being created.

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: build and publish release
    runs-on: ubuntu-latest
    env:
      CRX_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Read version and set tag
        id: meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Publishing release for version $version with tag v$version"

      - name: Build the extension
        run: node scripts/build.mjs

      - name: Set up Chrome for signing
        id: chrome
        if: env.CRX_KEY != ''
        uses: browser-actions/setup-chrome@v1

      - name: Pack a signed CRX
        if: env.CRX_KEY != ''
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/doble-parsi.pem"
          printf '%s\n' "$CRX_KEY" > "$key"
          chmod 600 "$key"
          "$CHROME" --no-sandbox \
            --pack-extension="$GITHUB_WORKSPACE/dist/doble-parsi" \
            --pack-extension-key="$key"
          rm -f "$key"
          mv dist/doble-parsi.crx "dist/doble-parsi-$VERSION.crx"

      - name: Write SHA-256 checksums
        working-directory: dist
        run: |
          rm -f checksums.txt
          sha256sum *.zip > checksums.txt
          if ls *.crx >/dev/null 2>&1; then sha256sum *.crx >> checksums.txt; fi
          cat checksums.txt

      - name: Publish the GitHub release
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          assets=("dist/doble-parsi-${VERSION}-chrome.zip" dist/checksums.txt)
          for crx in dist/*.crx; do [ -f "$crx" ] && assets+=("$crx"); done
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; refreshing its notes and files."
            gh release edit "$TAG" --title "Doble Parsi $TAG" --notes-file .github/release-notes.md --latest
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Doble Parsi $TAG" \
              --notes-file .github/release-notes.md \
              --latest
          fi
